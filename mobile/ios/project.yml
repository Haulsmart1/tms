name: TMSWizard
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TMSWizard:
    type: application
    platform: iOS
    sources: [TMSWizard]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cloud.tmswizard.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: TMS Wizard
        UILaunchScreen: {}
        WKAppBoundDomains: [tmswizard.cloud]
        NSCameraUsageDescription: Scan job barcodes and take proof-of-delivery photos.
        NSLocationWhenInUseUsageDescription: Share your location while using TMS Driver.
